[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "simulator"
version = "0.1.0"
description = "Home simulation project with sensors, logs, graphs, and LLM smart meter analysis"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "Pillow>=10.0",
  "requests>=2.31",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "dtaidistance>=2.3",
]

[project.optional-dependencies]
test = [
  "coverage[toml]>=7.6",
  "tomli>=2; python_version < '3.11'",
]

[tool.coverage.run]
branch = true
source = ["."]
omit = [
  "tests/*",
  ".venv*/*",
  "build/*",
  "scripts/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = ["if __name__ == [\"']__main__[\"']:"]

[tool.setuptools]
py-modules = [
  "activity",
  "activity_recognition",
  "automatic",
  "canvas_zoom",
  "common",
  "consumption_profiles",
  "device",
  "device_properties",
  "door",
  "graph",
  "house_state",
  "har_benchmark",
  "har_classifier",
  "har_experiment",
  "har_features",
  "har_metrics",
  "irrigation_controller",
  "label_layout",
  "lighting",
  "log",
  "main",
  "models",
  "point",
  "prediction",
  "read",
  "recognition_library",
  "recognition_evaluation",
  "reference_transfer",
  "room_recognition",
  "sensor",
  "sim",
  "timer",
  "utils",
  "wall",
]

[tool.setuptools.packages.find]
include = ["app*", "LLM*"]
