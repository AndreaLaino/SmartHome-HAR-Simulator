name: Simulator tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  headless:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    env:
      MPLBACKEND: Agg
      AWS_EC2_METADATA_DISABLED: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test tools
        run: python -m pip install -e ".[test]"
      - name: Run headless unit and integration tests
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Report coverage
        run: python -m coverage report
      - name: Write coverage artifact
        run: python -m coverage xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: coverage.xml

  tkinter:
    runs-on: ubuntu-latest
    env:
      SIMULATOR_GUI_TESTS: '1'
      MPLBACKEND: Agg
      AWS_EC2_METADATA_DISABLED: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install virtual display and Tk
        run: sudo apt-get update && sudo apt-get install -y xvfb python3-tk
      - name: Install project
        run: python -m pip install -e .
      - name: Run real Tk widget smoke tests
        run: xvfb-run -a python -m unittest discover -s tests -p test_tk_smoke.py -v
